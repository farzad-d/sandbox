<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carousel</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="index.js"></script>
  </head>
  <body>
    <div id="carousel-container">
      <div id="image-frame">
        <div id="image-strip">
          <!-- These images are just placeholders replace them with actual ones -->
          <img src="images/1.jpg" alt="nature" />
          <img src="images/2.jpg" alt="nature" />
          <img src="images/3.jpg" alt="nature" />
          <img src="images/4.jpg" alt="nature" />
          <img src="images/5.jpg" alt="nature" />
          <img src="images/6.jpg" alt="nature" />
        </div>
        <div id="indicator-container">
          <button class="indicator-btn" data-index="0">●</button>
          <button class="indicator-btn" data-index="1">○</button>
          <button class="indicator-btn" data-index="2">○</button>
          <button class="indicator-btn" data-index="3">○</button>
          <button class="indicator-btn" data-index="4">○</button>
          <button class="indicator-btn" data-index="5">○</button>
        </div>
        <button id="next-btn" class="slide-btn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path
              d="M8.59,18.16L14.25,12.5L8.59,6.84L7.89,7.55L12.84,12.5L7.89,17.45L8.59,18.16Z"
            />
          </svg>
        </button>
        <button id="prev-btn" class="slide-btn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path
              d="M14.41,18.16L8.75,12.5L14.41,6.84L15.11,7.55L10.16,12.5L15.11,17.45L14.41,18.16Z"
            />
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
